    tradeoff: >-
      Re-reading and hashing every selected passage costs local CPU and requires
      a source-version story. v1 adopts the recommended `content_revision` +
      `content_hash` columns for C's long-lived citations; subtitles use their
      saved revision and PDF uses the document hash plus extractor version. A
      text hash remains only as a legacy/OCR fallback.
